      // ── Download helper ───────────────────────────────────────────────
      function startDownload(ytId, title) {
        return new Promise(async (resolve, reject) => {
          const outDir = isElectron
            ? await window.electronAPI.storeGet("downloadDir", "")
            : "";
          const es = new EventSource(
            `${API_BASE}/download-stream?id=${encodeURIComponent(ytId)}&title=${encodeURIComponent(title || ytId)}&outDir=${encodeURIComponent(outDir)}`,
          );
          let settled = false;
          es.onmessage = (e) => {
            const d = JSON.parse(e.data);
            if (d.type === "start") {
              console.log("[download] saving to", d.outPath);
            }
            if (d.type === "progress") {
              console.log("[download]", d.line);
            }
            if (d.type === "done") {
              settled = true;
              const tr = tracks.find((t) => t.ytId === ytId);
              if (tr) tr.localPath = d.outPath;
              es.close();
              if (isElectron) scanLibrary();
              resolve(d.outPath);
            }
            if (d.type === "error") {
              settled = true;
              console.error("[download] error:", d.message);
              es.close();
              reject(new Error(d.message));
            }
          };
          // onerror also fires when the server closes the connection normally —
          // only treat it as a failure if we haven't already received done/error
          es.onerror = () => {
            if (!settled) {
              settled = true;
              console.error("[download] SSE connection lost");
              es.close();
              reject(new Error("Download connection lost"));
            }
          };
        });
      }

      // ── Search ────────────────────────────────────────────────────────
      let searchQuery = "";
      let ytDebounce = null;
      let searchAbort = null;

      function closeSearch() {
        const input = document.getElementById("search-input");
        input.value = "";
        searchQuery = "";
        libSearchQuery = "";
        clearTimeout(ytDebounce);
        hideYtResults();
        renderLibrary();
      }

      function filterQueue(q) {
        const query = q.toLowerCase().trim();
        clearTimeout(ytDebounce);
        if (!query) {
          searchQuery = "";
          libSearchQuery = "";
          hideYtResults();
          renderLibrary();
          return;
        }
        // Keep searchQuery in sync so the stale-check inside searchYouTube passes
        searchQuery = query;
        // Also filter local library
        libSearchQuery = query;
        renderLibrary();
        // Search YouTube with debounce
        showYtLoading();
        ytDebounce = setTimeout(() => searchYouTube(query), 600);
      }

      function hideYtResults() {
        document.getElementById("yt-results-wrap").classList.remove("open");
        document.getElementById("yt-list").innerHTML = "";
        document.getElementById("yt-count").textContent = "";
      }

      function showYtLoading() {
        document.getElementById("yt-results-wrap").classList.add("open");
        document.getElementById("yt-count").textContent = "";
        document.getElementById("yt-list").innerHTML =
          `<div class="px-3.5 py-4 flex items-center gap-2"><span class="font-mono text-[9px] text-muted searching">SEARCHING YOUTUBE...</span></div>`;
      }

      async function searchYouTube(query) {
        searchAbort?.abort();
        searchAbort = new AbortController();
        const { signal } = searchAbort;
        let results = null;
        if (isElectron) {
          try {
            const res = await fetch(
              `${API_BASE}/search?q=${encodeURIComponent(query)}`,
              { signal },
            );
            results = await res.json();
          } catch (err) {
            if (err.name === "AbortError") return;
            console.error("[search]", err);
          }
        } else {
          for (const base of [
            "https://invidious.privacyredirect.com",
            "https://inv.tux.pizza",
          ]) {
            try {
              const res = await fetch(
                `${base}/api/v1/search?q=${encodeURIComponent(query)}&type=video&fields=videoId,title,author,lengthSeconds`,
                { signal: AbortSignal.timeout(5000) },
              );
              if (!res.ok) continue;
              const raw = await res.json();
              results = raw.map((v) => ({
                id: v.videoId,
                title: v.title,
                author: v.author,
                duration: v.lengthSeconds,
                durStr: null,
              }));
              break;
            } catch {
              continue;
            }
          }
        }

        if (searchQuery !== query) return;

        const ytList = document.getElementById("yt-list");
        const ytCount = document.getElementById("yt-count");

        if (!results || results.length === 0) {
          ytCount.textContent = "no results";
          ytList.innerHTML = `<div class="px-3.5 py-4 font-mono text-[10px] text-muted text-center">nothing found on YouTube</div>`;
          return;
        }

        const top = results.slice(0, 8);
        ytCount.textContent = top.length + " found";
        ytList.innerHTML = "";

        top.forEach((item) => {
          const durSec = item.duration || 0;
          const durStr =
            item.durStr ||
            (durSec
              ? `${Math.floor(durSec / 60)}:${String(durSec % 60).padStart(2, "0")}`
              : "?:??");

          const row = document.createElement("div");
          row.className =
            "flex items-center gap-2.5 px-3.5 py-[9px] border-b border-border last:border-b-0 transition-colors hover:bg-panel group";

          row.innerHTML = `
            <svg class="flex-shrink-0 text-muted group-hover:text-accent transition-colors" width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
              <path d="M23 7s-.3-1.9-1.2-2.7c-1.1-1.2-2.4-1.2-3-1.3C16.1 3 12 3 12 3s-4.1 0-6.8.2c-.6.1-1.9.1-3 1.3C1.3 5.1 1 7 1 7S.7 9.1.7 11.2v2c0 2 .3 4.2.3 4.2s.3 1.9 1.2 2.7c1.1 1.2 2.6 1.1 3.3 1.2C7.2 21.5 12 21.5 12 21.5s4.1 0 6.8-.3c.6-.1 1.9-.1 3-1.3.9-.8 1.2-2.7 1.2-2.7s.3-2.1.3-4.2v-2C23.3 9.1 23 7 23 7zM9.7 15.5v-7.3l8.1 3.7-8.1 3.6z"/>
            </svg>
            <div class="flex-1 min-w-0 cursor-pointer" title="Play now">
              <div class="text-xs text-txt whitespace-nowrap overflow-hidden text-ellipsis">${item.title}</div>
              <div class="font-mono text-[9px] text-muted mt-0.5">${item.author || ""}</div>
            </div>
            <span class="font-mono text-[9px] text-muted flex-shrink-0">${durStr}</span>
            <button class="add-btn flex-shrink-0 opacity-0 group-hover:opacity-100 transition-opacity bg-transparent border-none cursor-pointer p-1 rounded text-muted hover:text-accent" title="Add to queue">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
            <button class="dl-btn flex-shrink-0 opacity-0 group-hover:opacity-100 transition-opacity bg-transparent border-none cursor-pointer p-1 rounded text-muted hover:text-accent" title="Download MP3">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
            </button>
          `;

          // Click title area → add to queue + play immediately, then close search
          row.querySelector(".flex-1").addEventListener("click", () => {
            const idx = addToQueue({
              title: item.title,
              meta: item.author || "YouTube",
              dur: durStr,
              durSec: durSec,
              ytId: item.id,
            });
            closeSearch();
            skipToTrack(idx);
          });

          // + button → add to queue only, close search so queue is visible
          row.querySelector(".add-btn").addEventListener("click", (e) => {
            e.stopPropagation();
            addToQueue({
              title: item.title,
              meta: item.author || "YouTube",
              dur: durStr,
              durSec: durSec,
              ytId: item.id,
            });
            closeSearch();
            const btn = e.currentTarget;
            btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="text-accent" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
            btn.style.opacity = "1";
            setTimeout(() => {
              btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
              btn.style.opacity = "";
            }, 1500);
          });

          // Download button → save MP3 to disk (no queue change)
          row.querySelector(".dl-btn").addEventListener("click", (e) => {
            e.stopPropagation();
            if (!isElectron) return;
            const btn = e.currentTarget;
            // Show spinner while downloading
            btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="text-muted" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8" stroke-dasharray="25 75" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.9s" repeatCount="indefinite"/></circle></svg>`;
            btn.style.opacity = "1";
            btn.disabled = true;
            startDownload(item.id, item.title)
              .then(() => {
                btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="text-accent" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
                setTimeout(() => {
                  btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
                  btn.style.opacity = "";
                  btn.disabled = false;
                }, 2000);
              })
              .catch(() => {
                btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
                btn.style.opacity = "";
                btn.disabled = false;
              });
          });

          ytList.appendChild(row);
        });
      }

      // ── Queue — drag-to-reorder ────────────────────────────────────────
      let dragSrcIdx = null;

      function renderQueue() {
        const list = document.getElementById("queue-list");

        // Never filter the queue by search — search is YouTube-only now
        const filtered = tracks.map((tr, i) => ({ tr, i }));

        document.getElementById("q-count").textContent =
          tracks.length + " track" + (tracks.length !== 1 ? "s" : "");

        list.innerHTML = "";

        if (tracks.length === 0) {
          list.innerHTML = `<div class="px-3.5 py-5 font-mono text-[10px] text-muted text-center">queue is empty — click a track to play</div>`;
          return;
        }

        filtered.forEach(({ tr, i }) => {
          const isActive = i === currentTrack;
          const isPlaying = isActive && !audio.paused;
          const item = document.createElement("div");
          item.draggable = true;
          item.dataset.idx = i;
          item.className = [
            "flex items-center gap-2 px-3 py-[8px]",
            "border-b border-border last:border-b-0 transition-colors select-none",
            isActive ? "" : "hover:bg-panel",
            "group cursor-default",
          ].join(" ");
          if (isActive) {
            item.style.background = `rgba(${_tc.accentRGB[0]},${_tc.accentRGB[1]},${_tc.accentRGB[2]},0.08)`;
          }

          const displayTitle = tr.title;

          item.innerHTML = `
            <!-- Drag handle -->
            <div class="drag-handle flex-shrink-0 cursor-grab active:cursor-grabbing text-muted opacity-0 group-hover:opacity-60 hover:!opacity-100 transition-opacity px-0.5" title="Drag to reorder">
              <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor">
                <circle cx="3" cy="3" r="1.2"/><circle cx="7" cy="3" r="1.2"/>
                <circle cx="3" cy="7" r="1.2"/><circle cx="7" cy="7" r="1.2"/>
                <circle cx="3" cy="11" r="1.2"/><circle cx="7" cy="11" r="1.2"/>
              </svg>
            </div>
            <!-- Track number / playing indicator -->
            <span class="font-mono text-[9px] w-3.5 flex-shrink-0 ${isActive ? "text-accent" : "text-muted"}">${isPlaying ? "▶" : i + 1}</span>
            <!-- Title + meta -->
            <div class="flex-1 min-w-0 cursor-pointer">
              <div class="text-xs text-txt whitespace-nowrap overflow-hidden text-ellipsis">${displayTitle}</div>
              <div class="font-mono text-[9px] text-muted mt-0.5">${tr.meta || ""}</div>
            </div>
            <span class="font-mono text-[9px] text-muted flex-shrink-0">${tr.dur && tr.dur !== "?:??" ? tr.dur : tr.durSec > 0 ? fmtTime(tr.durSec) : ""}</span>
            <!-- Remove button -->
            <button class="remove-btn flex-shrink-0 opacity-0 group-hover:opacity-60 hover:!opacity-100 transition-opacity bg-transparent border-none cursor-pointer p-1 rounded text-muted hover:text-accent" title="Remove from queue">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          `;

          // Play on title click
          item
            .querySelector(".flex-1")
            .addEventListener("click", () => skipToTrack(i));

          // Remove
          item.querySelector(".remove-btn").addEventListener("click", (e) => {
            e.stopPropagation();
            if (i === 0) {
              // Removing current track — advance
              advanceQueue();
            } else {
              tracks.splice(i, 1);
              renderQueue();
            }
          });

          // Drag-to-reorder
          item.addEventListener("dragstart", (e) => {
            dragSrcIdx = i;
            e.dataTransfer.effectAllowed = "move";
            setTimeout(() => item.classList.add("opacity-40"), 0);
          });
          item.addEventListener("dragend", () => {
            item.classList.remove("opacity-40");
            list
              .querySelectorAll("[data-idx]")
              .forEach((el) =>
                el.classList.remove("border-t-accent", "border-t-2"),
              );
          });
          item.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            list
              .querySelectorAll("[data-idx]")
              .forEach((el) =>
                el.classList.remove("border-t-accent", "border-t-2"),
              );
            item.classList.add("border-t-accent", "border-t-2");
          });
          item.addEventListener("dragleave", () => {
            item.classList.remove("border-t-accent", "border-t-2");
          });
          item.addEventListener("drop", (e) => {
            e.preventDefault();
            item.classList.remove("border-t-accent", "border-t-2");
            const dropIdx = parseInt(item.dataset.idx, 10);
            if (dragSrcIdx === null || dragSrcIdx === dropIdx) return;

            // Reorder tracks array
            const [moved] = tracks.splice(dragSrcIdx, 1);
            const insertAt = dragSrcIdx < dropIdx ? dropIdx - 1 : dropIdx;
            tracks.splice(insertAt, 0, moved);

            // currentTrack is always 0
            currentTrack = 0;
            dragSrcIdx = null;
            renderQueue();
          });

          list.appendChild(item);
        });
      }

      // ── Settings ─────────────────────────────────────────────────────
      let settingsOpen = false;

      function toggleSettings() {
        settingsOpen = !settingsOpen;
        document.getElementById("settings-overlay").classList.toggle("open", settingsOpen);
      }

      // ── Theme Color ─────────────────────────────────────────────────
      function hexToHSL(hex) {
        let r = parseInt(hex.slice(1, 3), 16) / 255;
        let g = parseInt(hex.slice(3, 5), 16) / 255;
        let b = parseInt(hex.slice(5, 7), 16) / 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) { h = s = 0; }
        else {
          const d = max - min;
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
          else if (max === g) h = ((b - r) / d + 2) / 6;
          else h = ((r - g) / d + 4) / 6;
        }
        return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
      }

      function hslToHex(h, s, l) {
        s /= 100; l /= 100;
        const a = s * Math.min(l, 1 - l);
        const f = (n) => {
          const k = (n + h / 30) % 12;
          const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
          return Math.round(255 * color).toString(16).padStart(2, "0");
        };
        return `#${f(0)}${f(8)}${f(4)}`;
      }

      function applyThemeColor(hex) {
        if (!/^#[0-9a-fA-F]{6}$/.test(hex)) return;
        const root = document.documentElement;
        const [h, s, l] = hexToHSL(hex);

        // Derive accent variants
        const accent2 = hslToHex(h, Math.min(100, s + 10), Math.max(5, l - 15));
        const accent3 = hslToHex(h, s, Math.min(95, l + 20));

        // Derive entire UI palette tinted to the accent hue
        // Low saturation so backgrounds feel subtle, not garish
        const bg      = hslToHex(h, Math.min(s, 12), 4);
        const panel   = hslToHex(h, Math.min(s, 14), 6);
        const surface = hslToHex(h, Math.min(s, 12), 8);
        const border  = hslToHex(h, Math.min(s, 14), 13);
        const muted   = hslToHex(h, Math.min(s, 16), 30);
        const txt     = hslToHex(h, Math.min(s, 15), 90);

        // Update cache first (used by visualizer + UI helpers)
        _updateThemeCache(hex, accent2, accent3, muted, border, txt);

        root.style.setProperty("--color-accent", hex);
        root.style.setProperty("--color-accent2", accent2);
        root.style.setProperty("--color-accent3", accent3);
        root.style.setProperty("--color-bg", bg);
        root.style.setProperty("--color-panel", panel);
        root.style.setProperty("--color-surface", surface);
        root.style.setProperty("--color-border", border);
        root.style.setProperty("--color-muted", muted);
        root.style.setProperty("--color-txt", txt);

        // Update shadows
        root.style.setProperty("--shadow-accent", `0 0 8px ${hex}`);
        root.style.setProperty("--shadow-accent-lg", `0 0 20px ${hex}44`);
        root.style.setProperty("--shadow-accent-sm", `0 0 6px ${hex}`);

        // Update Electron title bar
        document.body.style.backgroundColor = bg;

        // Sync inputs
        document.getElementById("color-picker").value = hex;
        document.getElementById("color-hex").value = hex;

        // Re-render components that use inline styles with theme colors
        renderQueue();
        syncPlayUI();

        // Persist
        if (isElectron) window.electronAPI.storeSet("themeColor", hex);
      }

      function onHexInput(val) {
        const hex = val.startsWith("#") ? val : "#" + val;
        if (/^#[0-9a-fA-F]{6}$/.test(hex)) {
          applyThemeColor(hex);
        }
      }

      // ── Music Dir ────────────────────────────────────────────────────
      function updateMusicDirDisplay(dir) {
        const el = document.getElementById("music-dir-display");
        if (dir) {
          el.textContent = dir;
          el.title = dir;
        } else {
          el.textContent = "~/Music (default)";
          el.title = "";
        }
      }

      async function chooseMusicDir() {
        if (!isElectron) return;
        const dir = await window.electronAPI.chooseMusicDir();
        if (dir) {
          customMusicDir = dir;
          updateMusicDirDisplay(dir);
          scanLibrary();
        }
      }

      async function resetMusicDir() {
        customMusicDir = "";
        if (isElectron) await window.electronAPI.storeSet("musicDir", "");
        updateMusicDirDisplay("");
        scanLibrary();
      }

      // ── Load saved settings on startup ──────────────────────────────
      async function loadSettings() {
        if (!isElectron) return;
        const [color, dir] = await Promise.all([
          window.electronAPI.storeGet("themeColor", ""),
          window.electronAPI.storeGet("musicDir", ""),
        ]);
        if (color) applyThemeColor(color);
        if (dir) {
          customMusicDir = dir;
          updateMusicDirDisplay(dir);
        }
      }

      renderQueue();
      syncPlayUI();
      syncLibraryCollapse();
      // Auto-scan local music on startup
      if (isElectron) {
        loadSettings().then(() => scanLibrary());
      } else {
        document.getElementById("lib-status").textContent =
          "local scan requires Electron";
      }
    </script>
  </body>
</html>
